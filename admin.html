<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Staff panel — Supreme Tours &amp; Travels</title>
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="font-sans antialiased bg-paper">

<!-- Sign in -->
<div id="login" class="min-h-screen grid place-items-center p-5">
  <div class="bg-white rounded-[22px] shadow-deep w-full max-w-[380px] p-7">
    <div class="flex items-center gap-3 mb-5">
      <svg viewBox="0 0 400 300" class="w-12 h-9"><use href="#brandmark"/></svg>
      <div><p class="font-display font-extrabold text-[16px] text-deep">Staff panel</p>
        <p class="text-[12px] text-[#5C7688]">Supreme Tours &amp; Travels</p></div>
    </div>
    <form onsubmit="signIn(event)" class="grid gap-3.5">
      <div><label class="lbl" for="ad-email">Email</label><input id="ad-email" type="email" class="field" placeholder="admin@supremetours.com" required></div>
      <div><label class="lbl" for="ad-pass">Password</label><input id="ad-pass" type="password" class="field" placeholder="••••••••" required></div>
      <p id="ad-err" class="hide text-[12.5px] text-[#B4361F] bg-[#FDECE8] rounded-lg px-3 py-2"></p>
      <button class="bg-deep text-white font-bold py-3 rounded-xl">Sign in</button>
      <a href="index.html" class="text-[#5C7688] text-[13px] font-semibold text-center">Back to the website</a>
    </form>
    <p class="text-[11.5px] text-[#5C7688] mt-4 leading-relaxed" id="ad-hint"></p>
  </div>
</div>

<!-- Panel -->
<div id="panel" class="hide min-h-screen">
  <header class="bg-ink text-white sticky top-0 z-30 noprint">
    <div class="wrap-wide flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <svg viewBox="0 0 400 300" class="w-11 h-8"><use href="#brandmark"/></svg>
        <span class="font-display font-bold text-[15px]">Staff panel</span>
        <span id="mode" class="chip bg-white/10 text-white/80"></span>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="text-[13px] font-semibold text-white/75 hover:text-sun px-3 py-2">View website</a>
        <button onclick="signOut()" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-[13px] font-semibold px-3 py-2 rounded-lg"><svg class="i text-[15px]"><use href="#ic-out"/></svg>Sign out</button>
      </div>
    </div>
    <div class="wrap-wide flex gap-1 overflow-x-auto pb-2" id="tabs"></div>
  </header>
  <main class="wrap-wide py-7" id="pane"></main>
</div>

<!-- Editor drawer -->
<div id="editor" class="hide fixed inset-0 z-[70] bg-ink/60 p-4 overflow-y-auto noprint">
  <div class="bg-white rounded-[20px] max-w-[660px] w-full mx-auto my-6 shadow-deep">
    <div class="flex items-center justify-between px-6 py-4 border-b border-[#E2EAEF]">
      <h3 id="ed-title" class="font-display font-bold text-[17px]">Edit</h3>
      <button onclick="closeEditor()" class="w-9 h-9 grid place-items-center rounded-full hover:bg-paper" aria-label="Close"><svg class="i text-[20px]"><use href="#ic-x"/></svg></button>
    </div>
    <form id="ed-form" onsubmit="saveEditor(event)" class="p-6 grid gap-4"></form>
  </div>
</div>

<!-- Printable quotation / invoice -->
<div id="doc"></div>

<div id="toast" class="hide"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
